<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f7f9; color: #1d2330;
           font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .card { max-width: 560px; margin: 16px; padding: 24px 28px; background: #fff; border: 1px solid #e3e6ec; border-radius: 10px; }
    h1 { font-size: 18px; margin: 0 0 10px; }
    li { margin: 4px 0; }
    code { background: #f1f3f5; padding: 1px 5px; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>{{ title }}</h1>
    <ul>{% for message in messages %}<li>{{ message }}</li>{% endfor %}</ul>
    <p>Example: <code>/api/v1/route/map/?start_location=Chicago, IL&amp;finish_location=Denver, CO</code></p>
  </div>
</body>
</html>
